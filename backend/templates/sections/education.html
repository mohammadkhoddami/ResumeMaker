<section class="cv-section">
  <h2 class="section-title">تحصیلات</h2>
  {% for item in section.items %}
  <div class="cv-item">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h3 style="font-family: {{ theme_config.heading_font }}; font-size: 1em; font-weight: 700; color: {{ theme_config.colors.text }};">{{ item.degree }}</h3>
      {% if item.period %}
      <span style="font-size: 0.85em; color: {{ theme_config.colors.secondary }};">{{ item.period }}</span>
      {% endif %}
    </div>
    <p style="font-size: 0.95em; color: {{ accent_color }}; font-weight: 600;">{{ item.institution }}</p>
    {% if item.gpa %}
    <p style="font-size: 0.85em; color: {{ theme_config.colors.secondary }}; margin-top: 4px;">معدل: {{ item.gpa }}</p>
    {% endif %}
  </div>
  {% endfor %}
</section>
